name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: straub-ah-api
  CADDY_CONTAINER_NAME: straub-ah-caddy
  DOCKER_NETWORK: straub-ah
  SERVER_NAME: straubah.duckdns.org

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Log the Droplet in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
        run: |
          port="${DROPLET_SSH_PORT:-22}"
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes -p "$port" \
            "${DROPLET_USER}@${DROPLET_HOST}" \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Upload Caddy configuration
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
        run: |
          port="${DROPLET_SSH_PORT:-22}"
          scp -o BatchMode=yes -P "$port" ./Caddyfile \
            "${DROPLET_USER}@${DROPLET_HOST}:/opt/straub-ah/Caddyfile"

      - name: Deploy and verify image
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          port="${DROPLET_SSH_PORT:-22}"
          ssh -o BatchMode=yes -p "$port" "${DROPLET_USER}@${DROPLET_HOST}" \
            bash -s -- "$IMAGE" "$CONTAINER_NAME" "$CADDY_CONTAINER_NAME" "$DOCKER_NETWORK" "$SERVER_NAME" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          image="$1"
          container_name="$2"
          caddy_container_name="$3"
          network_name="$4"
          server_name="$5"
          env_file=/opt/straub-ah/.env
          caddyfile=/opt/straub-ah/Caddyfile
          data_volume=straub-ah-data
          caddy_data_volume=straub-ah-caddy-data
          caddy_config_volume=straub-ah-caddy-config
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          if [[ ! -r "$env_file" ]]; then
            echo "Required environment file is missing or unreadable: $env_file" >&2
            exit 1
          fi

          if [[ ! -r "$caddyfile" ]]; then
            echo "Required Caddy configuration is missing or unreadable: $caddyfile" >&2
            exit 1
          fi

          docker network inspect "$network_name" >/dev/null 2>&1 \
            || docker network create "$network_name" >/dev/null

          previous_image=""
          if docker container inspect "$container_name" >/dev/null 2>&1; then
            previous_image="$(docker container inspect --format '{{.Config.Image}}' "$container_name")"
          fi

          run_container() {
            docker run --detach \
              --name "$container_name" \
              --restart unless-stopped \
              --network "$network_name" \
              --network-alias api \
              --env-file "$env_file" \
              --env PODCAST_DB_PATH=/data/podcast_worker.db \
              --env PODCAST_OUTPUT_DIR=/data/output \
              --volume "$data_volume:/data" \
              --publish 127.0.0.1:8100:8100 \
              "$1"
          }

          docker pull "$image"
          docker rm --force "$container_name" >/dev/null 2>&1 || true
          run_container "$image"

          healthy=false
          for _ in $(seq 1 30); do
            status="$(docker container inspect --format '{{.State.Health.Status}}' "$container_name" 2>/dev/null || true)"
            if [[ "$status" == healthy ]]; then
              healthy=true
              break
            fi
            if [[ "$status" == unhealthy ]]; then
              break
            fi
            sleep 5
          done

          if [[ "$healthy" != true ]]; then
            echo "Deployment failed its container health check." >&2
            docker logs --tail 100 "$container_name" >&2 || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true

            if [[ -n "$previous_image" ]]; then
              echo "Restoring previous image: $previous_image" >&2
              run_container "$previous_image"
            fi
            exit 1
          fi

          mounted_volume="$(docker container inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Name}}{{end}}{{end}}' "$container_name")"
          configured_db="$(docker exec "$container_name" printenv PODCAST_DB_PATH)"
          if [[ "$mounted_volume" != "$data_volume" || "$configured_db" != "/data/podcast_worker.db" ]]; then
            echo "Persistent database configuration verification failed." >&2
            exit 1
          fi

          docker pull caddy:2-alpine
          docker rm --force "$caddy_container_name" >/dev/null 2>&1 || true
          docker run --detach \
            --name "$caddy_container_name" \
            --restart unless-stopped \
            --network "$network_name" \
            --env "SERVER_NAME=$server_name" \
            --publish 80:80 \
            --publish 443:443 \
            --volume "$caddyfile:/etc/caddy/Caddyfile:ro" \
            --volume "$caddy_data_volume:/data" \
            --volume "$caddy_config_volume:/config" \
            caddy:2-alpine

          public_healthy=false
          for _ in $(seq 1 30); do
            if python3 - "$server_name" <<'PY'
          import sys
          import urllib.request

          with urllib.request.urlopen(
              f"https://{sys.argv[1]}/api/v1/health",
              timeout=5,
          ) as response:
              if response.status != 200:
                  raise SystemExit(f"unexpected HTTP status: {response.status}")
          PY
            then
              public_healthy=true
              break
            fi

            if [[ "$(docker container inspect --format '{{.State.Status}}' "$caddy_container_name" 2>/dev/null || true)" != running ]]; then
              break
            fi
            sleep 5
          done

          if [[ "$public_healthy" != true ]]; then
            echo "Public HTTPS health check failed: https://$server_name/api/v1/health" >&2
            docker logs --tail 100 "$caddy_container_name" >&2 || true
            exit 1
          fi

          if [[ -n "$previous_image" && "$previous_image" != "$image" ]]; then
            docker image rm "$previous_image" >/dev/null 2>&1 || true
          fi
          echo "Deployed $image at https://$server_name"
          REMOTE_SCRIPT

      - name: Verify public endpoint from runner
        env:
          PUBLIC_HEALTH_URL: https://${{ env.SERVER_NAME }}/api/v1/health
        run: curl --fail --show-error --silent "$PUBLIC_HEALTH_URL"
