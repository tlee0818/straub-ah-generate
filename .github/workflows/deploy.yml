name: Deploy to DigitalOcean

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CONTAINER_NAME: straub-ah-api

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Log the Droplet in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
        run: |
          port="${DROPLET_SSH_PORT:-22}"
          printf '%s' "$GHCR_TOKEN" | ssh -o BatchMode=yes -p "$port" \
            "${DROPLET_USER}@${DROPLET_HOST}" \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Deploy and verify image
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          port="${DROPLET_SSH_PORT:-22}"
          ssh -o BatchMode=yes -p "$port" "${DROPLET_USER}@${DROPLET_HOST}" \
            bash -s -- "$IMAGE" "$CONTAINER_NAME" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          image="$1"
          container_name="$2"
          env_file=/opt/straub-ah/.env
          data_volume=straub-ah-data
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          if [[ ! -r "$env_file" ]]; then
            echo "Required environment file is missing or unreadable: $env_file" >&2
            exit 1
          fi

          previous_image=""
          if docker container inspect "$container_name" >/dev/null 2>&1; then
            previous_image="$(docker container inspect --format '{{.Config.Image}}' "$container_name")"
          fi

          run_container() {
            docker run --detach \
              --name "$container_name" \
              --restart unless-stopped \
              --env-file "$env_file" \
              --volume "$data_volume:/data" \
              --publish 127.0.0.1:8100:8100 \
              "$1"
          }

          docker pull "$image"
          docker rm --force "$container_name" >/dev/null 2>&1 || true
          run_container "$image"

          healthy=false
          for _ in $(seq 1 30); do
            status="$(docker container inspect --format '{{.State.Health.Status}}' "$container_name" 2>/dev/null || true)"
            if [[ "$status" == healthy ]]; then
              healthy=true
              break
            fi
            if [[ "$status" == unhealthy ]]; then
              break
            fi
            sleep 5
          done

          if [[ "$healthy" != true ]]; then
            echo "Deployment failed its container health check." >&2
            docker logs --tail 100 "$container_name" >&2 || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true

            if [[ -n "$previous_image" ]]; then
              echo "Restoring previous image: $previous_image" >&2
              run_container "$previous_image"
            fi
            exit 1
          fi

          if [[ -n "$previous_image" && "$previous_image" != "$image" ]]; then
            docker image rm "$previous_image" >/dev/null 2>&1 || true
          fi
          echo "Deployed $image"
          REMOTE_SCRIPT
